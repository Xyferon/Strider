<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRIDER | Investigation Console</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Global Colors */
            --bg-dark: #0b1220;
            --bg-card: #141d2d;
            --bg-panel: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #1e293b;

            /* Severities */
            --critical: #ef4444;
            /* Red */
            --high: #f97316;
            /* Orange */
            --medium: #3b82f6;
            /* Blue */
            --low: #64748b;
            /* Slate */
            --none: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* --- Top Bar & Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .brand span {
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 0.5rem;
        }

        .scan-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        input[type="text"] {
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 320px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--text-secondary);
        }

        button {
            padding: 0.75rem 1.5rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: filter 0.2s;
        }

        button:hover {
            filter: brightness(1.1);
        }

        .btn-scan {
            background-color: var(--critical);
            color: white;
        }

        .btn-download {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-download:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .system-status {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        /* --- Sub Header / Search --- */
        .sub-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-controls input {
            width: 400px;
        }

        /* --- Severity Distribution Panel --- */
        .distribution-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1.5rem;
        }

        .dist-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dist-bar-wrapper {
            display: flex;
            height: 12px;
            width: 100%;
            background: var(--bg-dark);
            margin-bottom: 1rem;
        }

        .dist-segment {
            height: 100%;
            transition: width 0.3s ease;
        }

        .dist-stats {
            display: flex;
            gap: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .dist-stats span {
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            margin-right: 0.5rem;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* --- Identity Cards --- */
        .investigation-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .case-card {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .case-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.03);
        }

        .severity-strip {
            width: 6px;
            flex-shrink: 0;
            background-color: var(--none);
        }

        .severity-strip.critical {
            background-color: var(--critical);
        }

        .severity-strip.high {
            background-color: var(--high);
        }

        .severity-strip.medium {
            background-color: var(--medium);
        }

        .severity-strip.low {
            background-color: var(--low);
        }

        .card-content {
            padding: 1.25rem 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-score {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
        }

        .card-score.critical {
            color: var(--critical);
            border-color: var(--critical);
        }

        .card-score.high {
            color: var(--high);
            border-color: var(--high);
        }

        .card-score.medium {
            color: var(--medium);
            border-color: var(--medium);
        }

        .card-score.low {
            color: var(--low);
            border-color: var(--low);
        }

        .card-mid {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .card-mid strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        .card-bottom {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-sources {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.75rem;
        }

        .chevron {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* --- Slide Panel --- */
        .slide-panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 900;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .slide-panel-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-panel {
            position: fixed;
            top: 0;
            right: -600px;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: right 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .slide-panel.active {
            right: 0;
        }

        .panel-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .panel-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .panel-close:hover {
            color: var(--text-primary);
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            word-break: break-all;
        }

        .panel-metrics {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .panel-score {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .panel-severity {
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border: 1px solid;
            letter-spacing: 1px;
        }

        .panel-severity.critical {
            color: var(--critical);
            border-color: var(--critical);
        }

        .panel-severity.high {
            color: var(--high);
            border-color: var(--high);
        }

        .panel-severity.medium {
            color: var(--medium);
            border-color: var(--medium);
        }

        .panel-severity.low {
            color: var(--low);
            border-color: var(--low);
        }

        .panel-body {
            padding: 2rem;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-left: 1px solid var(--border);
            margin-left: 0.5rem;
            padding-left: 1.5rem;
        }

        .timeline-item {
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -1.8rem;
            top: 0.3rem;
            width: 8px;
            height: 8px;
            background: var(--low);
            border-radius: 50%;
        }

        .timeline-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .timeline-content {
            font-size: 0.9rem;
        }

        .timeline-content a {
            color: var(--low);
            text-decoration: none;
        }

        .timeline-content a:hover {
            text-decoration: underline;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th {
            text-align: left;
            padding: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'JetBrains Mono', monospace;
        }

        td.entity-type {
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            font-style: italic;
            background: var(--bg-card);
            border: 1px solid var(--border);
        }

        /* Loading Overlay */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 18, 32, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .loader-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .loader-text {
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
    </style>
</head>

<body>

    <div class="loader-overlay" id="loader">
        <div
            style="width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--critical); border-radius: 50%; animation: spin 1s linear infinite;">
        </div>
        <div class="loader-text" id="loaderText">EXECUTING LIVE SCAN...</div>
    </div>
    <style>
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <div class="container">
        <header>
            <div class="brand">
                <h1>STRIDER<span>/ Investigation Console</span></h1>
            </div>
            <div class="scan-controls">
                <input type="text" id="targetScanInput" placeholder="Target domain or site...">
                <button id="targetScanBtn" class="btn-scan">RUN SCAN</button>
            </div>
            <div class="system-status">
                <div><span class="status-dot"></span>System Online</div>
                <div id="lastScanTime" style="margin-top: 0.25rem; font-family: 'JetBrains Mono', monospace;">Last Scan:
                    --</div>
            </div>
        </header>

        <div class="sub-bar">
            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="Search email / domain / incident...">
            </div>
            <div>
                <button id="downloadBtn" class="btn-download">Export JSON</button>
            </div>
        </div>

        <!-- Severity Distribution Panel -->
        <div class="distribution-panel" id="distPanel" style="display: none;">
            <div class="dist-header">
                <span>Severity Distribution</span>
            </div>
            <div class="dist-bar-wrapper" id="distBar">
                <!-- Segments injected by JS -->
            </div>
            <div class="dist-stats">
                <div><span>Identities Affected:</span> <span id="totalIdentities"
                        style="color:var(--text-primary); font-size:1rem;">0</span></div>
                <div><span>Total Exposures:</span> <span id="totalExposures"
                        style="color:var(--text-primary); font-size:1rem;">0</span></div>
            </div>
        </div>

        <div class="investigation-list" id="victimList">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Slide Panel -->
    <div class="slide-panel-overlay" id="panelOverlay"></div>
    <div class="slide-panel" id="detailPanel">
        <div class="panel-header">
            <button class="panel-close" id="closePanelBtn">&times;</button>
            <div class="panel-title" id="panelTitle">--</div>
            <div class="panel-metrics">
                <div class="panel-score" id="panelScore">--</div>
                <div class="panel-severity" id="panelSeverity">--</div>
            </div>
        </div>
        <div class="panel-body">

            <div>
                <div class="section-title">Exposure Timeline</div>
                <div class="timeline" id="panelTimeline">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <div>
                <div class="section-title">Detected Entities</div>
                <table>
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Masked Value</th>
                            <th>Confidence</th>
                        </tr>
                    </thead>
                    <tbody id="panelTableBody">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        let reportData = null;
        let cachedVictims = [];

        // Utility to determine severity from score if not explicitly set
        function getSeverity(score) {
            if (score >= 8.0) return 'critical';
            if (score >= 6.0) return 'high';
            if (score >= 3.0) return 'medium';
            if (score > 0) return 'low';
            return 'none';
        }

        async function loadData() {
            try {
                let resp;
                try {
                    resp = await fetch('/reports/scan_report.json?t=' + new Date().getTime());
                } catch (e) {
                    resp = await fetch('scan_report.json?t=' + new Date().getTime());
                }

                if (!resp || !resp.ok) {
                    resp = await fetch('scan_report.json?t=' + new Date().getTime());
                }
                if (!resp.ok) throw new Error("JSON not found");

                const data = await resp.json();
                reportData = data;

                cachedVictims = groupVictims(reportData.details);

                renderDistribution(cachedVictims);
                renderList(cachedVictims, '');

                if (reportData.timestamp) {
                    document.getElementById('lastScanTime').innerText = `Last Scan: ${new Date(reportData.timestamp).toISOString().replace('T', ' ').substring(0, 19)}`;
                }
            } catch (e) {
                document.getElementById('victimList').innerHTML = `<div class="empty-state">No operational data found. Execute a scan to begin.</div>`;
                console.error(e);
            }
        }

        function groupVictims(incidents) {
            let victims = {};

            incidents.forEach(inc => {
                let victimId = "Unknown Subject";

                for (let ent of inc.entities) {
                    if (ent.type === 'email' || ent.type === 'person') {
                        victimId = ent.raw_value || ent.masked_value;
                        break;
                    }
                }

                if (!victims[victimId]) {
                    victims[victimId] = {
                        id: victimId,
                        score: 0.0,
                        severity: "low",
                        entities: [],
                        incidents: [],
                        events: []
                    };
                }

                victims[victimId].incidents.push(inc);
                if (inc.url) victims[victimId].events.push(inc.url);
                victims[victimId].entities.push(...inc.entities.map(e => ({ ...e, url: inc.url, timestamp: inc.timestamp || reportData.timestamp })));

                if (inc.risk_score > victims[victimId].score) {
                    victims[victimId].score = inc.risk_score;
                    victims[victimId].severity = inc.severity || getSeverity(inc.risk_score);
                }
            });

            let arr = Object.values(victims);
            arr.sort((a, b) => b.score - a.score);
            return arr;
        }

        function renderDistribution(victims) {
            const panel = document.getElementById('distPanel');
            const bar = document.getElementById('distBar');

            if (victims.length === 0) {
                panel.style.display = 'none';
                return;
            }

            panel.style.display = 'block';

            let counts = { critical: 0, high: 0, medium: 0, low: 0, none: 0 };
            let totalEntities = 0;

            victims.forEach(v => {
                counts[v.severity] = (counts[v.severity] || 0) + 1;
                totalEntities += v.entities.length;
            });

            const total = victims.length;

            document.getElementById('totalIdentities').innerText = total;
            document.getElementById('totalExposures').innerText = totalEntities;

            bar.innerHTML = '';

            const order = ['critical', 'high', 'medium', 'low', 'none'];
            order.forEach(sev => {
                if (counts[sev] > 0) {
                    const pct = (counts[sev] / total) * 100;
                    const seg = document.createElement('div');
                    seg.className = 'dist-segment';
                    seg.style.width = `${pct}%`;
                    seg.style.backgroundColor = `var(--${sev})`;
                    seg.title = `${sev.toUpperCase()}: ${counts[sev]}`;
                    bar.appendChild(seg);
                }
            });
        }

        function renderList(victims, filterText) {
            const listContainer = document.getElementById('victimList');
            listContainer.innerHTML = '';

            let targetText = filterText.toLowerCase();

            let filtered = victims;
            if (targetText) {
                filtered = victims.filter(v =>
                    v.id.toLowerCase().includes(targetText) ||
                    v.entities.some(e => e.type.toLowerCase().includes(targetText)) ||
                    v.events.some(url => url.toLowerCase().includes(targetText))
                );
            }

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="empty-state">No identities matching operational criteria.</div>`;
                return;
            }

            filtered.forEach(v => {
                const item = document.createElement('div');
                item.className = 'case-card';

                item.onclick = () => openPanel(v.id);

                // Extract unique domains/sources
                let sources = new Set();
                v.events.forEach(url => {
                    try {
                        const domain = new URL(url).hostname;
                        sources.add(domain);
                    } catch (e) {
                        if (url.includes('github')) sources.add('github.com');
                        else if (url.includes('pastebin')) sources.add('pastebin.com');
                        else sources.add('Unknown');
                    }
                });
                const sourceStr = Array.from(sources).join(', ') || 'Unknown Source';

                item.innerHTML = `
                <div class="severity-strip ${v.severity}"></div>
                <div class="card-content">
                    <div class="card-top">
                        <div class="card-name">${v.id}</div>
                        <div class="card-score ${v.severity}">${v.score.toFixed(1)}</div>
                    </div>
                    <div class="card-mid">
                        <div>Exposures: <strong>${v.entities.length}</strong></div>
                        <div>Events: <strong>${v.incidents.length}</strong></div>
                    </div>
                    <div class="card-bottom">
                        <div class="card-sources">SOURCES: ${sourceStr}</div>
                        <div class="chevron">&#10095;</div>
                    </div>
                </div>
            `;
                listContainer.appendChild(item);
            });
        }

        function openPanel(victimId) {
            const victim = cachedVictims.find(v => v.id === victimId);
            if (!victim) return;

            document.getElementById('panelTitle').innerText = victim.id;

            const scoreEl = document.getElementById('panelScore');
            scoreEl.innerText = victim.score.toFixed(1);
            scoreEl.className = `panel-score`;
            scoreEl.style.color = `var(--${victim.severity})`;

            const sevEl = document.getElementById('panelSeverity');
            sevEl.innerText = victim.severity;
            sevEl.className = `panel-severity ${victim.severity}`;

            // Timeline
            const timeline = document.getElementById('panelTimeline');
            timeline.innerHTML = '';

            // Sort entities by time conceptually (if timestamp available, else use array order)
            victim.entities.forEach(e => {
                const timeStr = e.timestamp ? new Date(e.timestamp).toISOString().replace('T', ' ').substring(0, 19) : 'Unknown Time';
                const sourceLink = e.url ? `<a href="${e.url}" target="_blank">${e.url}</a>` : 'Unknown Source';

                const li = document.createElement('div');
                li.className = 'timeline-item';

                // Set dot color based on entity type risk implicitly or just default
                let dotColor = 'var(--low)';
                if (['password', 'credit_card'].includes(e.type)) dotColor = 'var(--critical)';

                li.innerHTML = `
                <div class="timeline-time">${timeStr}</div>
                <div class="timeline-content">
                    Detected <strong>${e.type.toUpperCase()}</strong> at ${sourceLink}
                </div>
            `;
                timeline.appendChild(li);
            });

            if (victim.entities.length === 0) {
                timeline.innerHTML = `<div style="color:var(--text-secondary); font-style:italic;">No discrete entity events.</div>`;
            }

            // Table
            const tbody = document.getElementById('panelTableBody');
            tbody.innerHTML = '';

            if (victim.entities.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-secondary);">No explicit entities extracted</td></tr>`;
            } else {
                victim.entities.forEach(e => {
                    const tr = document.createElement('tr');
                    const displayVal = e.raw_value || e.masked_value || '<redacted>';
                    tr.innerHTML = `
                    <td class="entity-type">${e.type}</td>
                    <td>${displayVal}</td>
                    <td>${(e.confidence * 100).toFixed(0)}%</td>
                `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('panelOverlay').classList.add('active');
            document.getElementById('detailPanel').classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closePanel() {
            document.getElementById('panelOverlay').classList.remove('active');
            document.getElementById('detailPanel').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('closePanelBtn').addEventListener('click', closePanel);
        document.getElementById('panelOverlay').addEventListener('click', closePanel);

        document.getElementById('searchInput').addEventListener('input', (e) => {
            if (cachedVictims.length > 0) renderList(cachedVictims, e.target.value);
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!reportData) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reportData, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", "strider_operational_export.json");
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        });

        document.getElementById('targetScanBtn').addEventListener('click', async () => {
            const target = document.getElementById('targetScanInput').value.trim();
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');

            loader.classList.add('active');
            loaderText.innerText = target ? `EXECUTING TARGETED SCAN: ${target}` : `EXECUTING GLOBAL SCAN`;

            try {
                const resp = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target })
                });
                if (!resp.ok) throw new Error("API operation failed.");
                await loadData();
            } catch (e) {
                alert("Scan execution failed: " + e.message);
            } finally {
                loader.classList.remove('active');
            }
        });

        // Boot
        loadData();

    </script>
</body>

</html>
