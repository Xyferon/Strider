<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strider | PII Leakage Dashboard</title>
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --critical: #ef4444;
            --high: #f97316;
            --medium: #eab308;
            --low: #3b82f6;
            --none: #0ea5e9;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls { display: flex; gap: 1rem; }

        input[type="text"] {
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            width: 300px;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.1); }

        button {
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }
        button:hover { transform: translateY(-2px); background: #2563eb; }

        /* Heatmap Section */
        .heatmap-container {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 2rem;
        }
        .heatmap-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }
        .heatmap-cell {
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s;
        }
        .heatmap-cell:hover { transform: scale(1.05); }
        .heatmap-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.25rem; font-weight: 600; }
        .heatmap-val { font-size: 1.5rem; font-weight: 800; }

        /* Color intensities for heatmap based on risk weighting */
        .intensity-high { background: rgba(239, 68, 68, 0.2); color: var(--critical); border: 1px solid var(--critical); }
        .intensity-medium { background: rgba(234, 179, 8, 0.2); color: var(--medium); border: 1px solid var(--medium); }
        .intensity-low { background: rgba(59, 130, 246, 0.2); color: var(--low); border: 1px solid var(--low); }
        .intensity-none { background: rgba(255,255,255,0.05); color: var(--text-secondary); }

        /* Victim List */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .list-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .list-item:hover {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }

        .list-item::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 4px; }
        .list-item[data-severity="critical"]::before { background: var(--critical); }
        .list-item[data-severity="high"]::before { background: var(--high); }
        .list-item[data-severity="medium"]::before { background: var(--medium); }
        .list-item[data-severity="low"]::before { background: var(--low); }
        .list-item[data-severity="none"]::before { background: var(--none); }

        .list-info { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .list-name { font-size: 1.1rem; font-weight: 600; color: white; min-width: 200px; }
        .list-meta { font-size: 0.85rem; color: var(--text-secondary); }
        .list-action { font-size: 0.85rem; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }

        /* Speedometer Gauge */
        .gauge {
            position: relative;
            width: 140px;
            height: 70px;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 0.5rem;
        }
        .gauge-bg, .gauge-fill {
            position: absolute;
            top: 0; left: 0;
            width: 140px; height: 140px;
            border-radius: 50%;
            box-sizing: border-box;
            border: 14px solid rgba(255,255,255,0.1);
            border-bottom-color: transparent;
            border-right-color: transparent;
            transform: rotate(-45deg);
        }
        .gauge-fill {
            border-color: var(--gauge-color, var(--accent)) var(--gauge-color, var(--accent)) transparent transparent;
            transform: rotate(-225deg); /* 0% */
            transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .gauge-center {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            line-height: 1;
        }
        
        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .badge.critical { background: rgba(239, 68, 68, 0.2); color: var(--critical); }
        .badge.high { background: rgba(249, 115, 22, 0.2); color: var(--high); }
        .badge.medium { background: rgba(234, 179, 8, 0.2); color: var(--medium); }
        .badge.low { background: rgba(59, 130, 246, 0.2); color: var(--low); }
        .badge.none { background: rgba(14, 165, 233, 0.2); color: var(--none); }

        .empty-state { text-align: center; padding: 4rem; color: var(--text-secondary); font-size: 1.2rem; grid-column: 1 / -1; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-close {
            position: absolute;
            top: 1rem; right: 1.5rem;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: none;
        }
        .modal-close:hover { color: white; }

        .modal-header { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .modal-title { font-size: 1.5rem; font-weight: 600; color: white; margin-bottom: 0.5rem; word-break: break-all; }

        .entity-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 0.5rem;
        }
        
        .entity-list::-webkit-scrollbar { width: 6px; }
        .entity-list::-webkit-scrollbar-track { background: transparent; }
        .entity-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .entity-item {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
        }

        .entity-type { color: var(--accent); font-weight: 600; font-size: 0.75rem; min-width: 80px; }
        .entity-value { color: var(--text-primary); font-family: monospace; }
        .entity-context { font-size: 0.75rem; color: var(--text-secondary); margin-left: auto; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Strider / Dashboard</h1>
        <div class="controls">
            <div style="display:flex; align-items:center; gap: 0.5rem; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 1.5rem; margin-right: 0.5rem;">
                <input type="text" id="targetScanInput" placeholder="Target Domain (e.g., dummy)">
                <button id="targetScanBtn" style="background:var(--critical);">Live Scan</button>
            </div>
            <input type="text" id="searchInput" placeholder="Filter Local Data...">
            <button id="downloadBtn">Download JSON</button>
        </div>
    </header>

    <div>
        <h2 id="summaryText" style="color: var(--text-secondary); font-size: 1rem; font-weight: 400; margin-bottom: 1rem;">
            Loading latest scan data...
        </h2>
    </div>

    <!-- Heatmap Section -->
    <div class="heatmap-container" id="heatmapContainer" style="display: none;">
        <div class="heatmap-title">Global Data Exposure Heatmap (By Entity Type)</div>
        <div class="heatmap-grid" id="heatmapGrid"></div>
    </div>

    <div class="list-container" id="victimList">
        <!-- Rendered by JS -->
    </div>
</div>

<!-- Modal Structure -->
<div class="modal-overlay" id="victimModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-header" style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div>
                <div class="modal-title" id="modalTitle">Victim Name</div>
                <div class="meta" style="justify-content: flex-start; gap: 1rem; margin-bottom: 0;">
                    <span id="modalBadge" class="badge">--</span>
                    <span id="modalCount">0 Records</span>
                </div>
            </div>
            
            <div class="gauge" id="gaugeContainer">
                <div class="gauge-bg"></div>
                <div class="gauge-fill" id="gaugeFill"></div>
                <div class="gauge-center">
                    <span id="gaugeValue">0.0</span><span style="font-size:0.5em">/10</span>
                </div>
            </div>
        </div>
        <ul class="entity-list" id="modalEntityList">
            <!-- Rendered by JS -->
        </ul>
    </div>
</div>

<script>
    let reportData = null;
    let cachedVictims = []; // Store parsed victims for modal access

    async function loadData() {
        try {
            // Try relative path first (if opened locally in /reports)
            // If that fails, try the absolute /reports route (if hosted by FastAPI on /)
            let resp;
            try {
                 resp = await fetch('/reports/scan_report.json?t=' + new Date().getTime());
            } catch(e) {
                 resp = await fetch('scan_report.json?t=' + new Date().getTime());
            }

            if (!resp || !resp.ok) {
                 resp = await fetch('scan_report.json?t=' + new Date().getTime());
            }
            if (!resp.ok) throw new Error("JSON not found");
            
            const data = await resp.json();
            reportData = data;
            
            cachedVictims = groupVictims(reportData.details);
            
            renderHeatmap(cachedVictims);
            renderList(cachedVictims, '');
            updateSummary(reportData.summary);
        } catch (e) {
            document.getElementById('summaryText').innerText = "Failed to load scan_report.json. Make sure to generate the report first.";
            console.error(e);
        }
    }

    // Process raw incidents into Victim-centric groups, preferring raw uncensored identifiers
    function groupVictims(incidents) {
        let victims = {};

        incidents.forEach(inc => {
            let victimId = "Unknown Victim";
            
            // Prefer raw_value (uncensored) for grouping if available, else masked
            for(let ent of inc.entities) {
                if(ent.type === 'email' || ent.type === 'person') {
                    victimId = ent.raw_value || ent.masked_value;
                    break;
                }
            }

            if (!victims[victimId]) {
                victims[victimId] = {
                    id: victimId, // Uncensored name
                    score: 0.0,
                    severity: "low",
                    entities: [],
                    incidents: [],
                    events: []
                };
            }

            victims[victimId].incidents.push(inc.incident_id);
            if (inc.url) victims[victimId].events.push(inc.url);
            victims[victimId].entities.push(...inc.entities.map(e => ({...e, url: inc.url})));
            if (inc.risk_score > victims[victimId].score) {
                victims[victimId].score = inc.risk_score;
                victims[victimId].severity = inc.severity;
            }
        });

        let arr = Object.values(victims);
        arr.sort((a,b) => b.score - a.score);
        return arr;
    }
    
    // Render the Heatmap of Entity Types
    function renderHeatmap(victims) {
        const hContainer = document.getElementById('heatmapContainer');
        const hGrid = document.getElementById('heatmapGrid');
        
        let counts = {};
        victims.forEach(v => {
            v.entities.forEach(e => {
                counts[e.type] = (counts[e.type] || 0) + 1;
            });
        });
        
        const types = Object.keys(counts);
        if(types.length === 0) return;
        
        hContainer.style.display = 'block';
        hGrid.innerHTML = '';
        
        // Sort types by count descending
        types.sort((a,b) => counts[b] - counts[a]).forEach(t => {
            let count = counts[t];
            // Determine risk color intensity
            let intensityClass = 'intensity-none';
            if (['credit_card', 'pan', 'aadhaar', 'ssn', 'password'].includes(t)) {
                intensityClass = count > 0 ? 'intensity-high' : 'intensity-none';
            } else if (['email', 'phone'].includes(t)) {
                intensityClass = count > 5 ? 'intensity-high' : (count > 0 ? 'intensity-medium' : 'intensity-none');
            } else {
                intensityClass = count > 10 ? 'intensity-medium' : (count > 0 ? 'intensity-low' : 'intensity-none');
            }

            const cell = document.createElement('div');
            cell.className = `heatmap-cell ${intensityClass}`;
            cell.innerHTML = `
                <div class="heatmap-label">${t}</div>
                <div class="heatmap-val">${count}</div>
            `;
            hGrid.appendChild(cell);
        });
    }

    function renderList(victims, filterText) {
        const listContainer = document.getElementById('victimList');
        listContainer.innerHTML = '';
        
        let targetText = filterText.toLowerCase();

        let filtered = victims;
        if(targetText) {
            filtered = victims.filter(v => 
                v.id.toLowerCase().includes(targetText) ||
                v.entities.some(e => e.type.toLowerCase().includes(targetText)) ||
                v.events.some(url => url.toLowerCase().includes(targetText))
            );
        }

        if(filtered.length === 0) {
            listContainer.innerHTML = `<div class="empty-state">No victims found matching criteria.</div>`;
            return;
        }

        // Render sleek list items
        filtered.forEach((v, index) => {
            const item = document.createElement('div');
            item.className = 'list-item';
            item.setAttribute('data-severity', v.severity);
            
            // On click, pop the modal with full details and trigger animation
            item.onclick = () => openModal(v.id);

            item.innerHTML = `
                <div class="list-info">
                    <span class="badge ${v.severity}">${v.severity} Risk</span>
                    <div class="list-name">${v.id}</div>
                    <div class="list-meta">${v.entities.length} records exposed across ${v.incidents.length} event(s)</div>
                </div>
                <div class="list-action">Click to view details &rarr;</div>
            `;
            listContainer.appendChild(item);
        });
    }
    
    // Modal Functions
    function openModal(victimId) {
        const victim = cachedVictims.find(v => v.id === victimId);
        if(!victim) return;
        
        document.getElementById('modalTitle').innerText = victim.id;
        
        const badge = document.getElementById('modalBadge');
        badge.className = `badge ${victim.severity}`;
        badge.innerText = `${victim.severity} Risk`;
        
        document.getElementById('modalCount').innerText = `${victim.entities.length} records exposed across ${victim.incidents.length} event(s)`;
        
        const list = document.getElementById('modalEntityList');
        
        if (victim.entities.length === 0) {
            list.innerHTML = `<li style="text-align:center; padding: 2rem; color: #64748b;">No explicit entities extracted (Contextual risk only)</li>`;
        } else {
            list.innerHTML = victim.entities.map(e => {
                const displayVal = e.raw_value || e.masked_value;
                const sourceLink = e.url ? `<a href="${e.url}" target="_blank" style="color:var(--accent); text-decoration:none;">${e.url}</a>` : 'Unknown Source';
                return `
                <li class="entity-item" style="flex-direction:column; align-items:flex-start; gap:0.5rem;">
                    <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                        <div><span class="entity-type">[${e.type.toUpperCase()}]</span>
                        <span class="entity-value">${displayVal}</span></div>
                        <span class="entity-context">Confidence: ${(e.confidence * 100).toFixed(0)}%</span>
                    </div>
                    <div style="font-size:0.75rem; color:var(--text-secondary); padding-left:0.5rem; border-left:2px solid var(--accent); width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        Detected in: ${sourceLink}
                    </div>
                </li>`;
            }).join('');
        }
        
        document.getElementById('victimModal').classList.add('active');
        
        // Speedometer Animation Logic
        const gaugeFill = document.getElementById('gaugeFill');
        const gaugeValue = document.getElementById('gaugeValue');
        const gaugeContainer = document.getElementById('gaugeContainer');
        
        // Reset gauge briefly so transition is noticeable
        gaugeFill.style.transition = 'none';
        gaugeFill.style.transform = 'rotate(-225deg)';
        gaugeValue.innerText = '0.0';
        
        let color = 'var(--low)';
        if(victim.severity === 'critical' || victim.severity === 'high') color = 'var(--critical)';
        else if(victim.severity === 'medium') color = 'var(--medium)';
        gaugeContainer.style.setProperty('--gauge-color', color);
        
        // Force reflow
        void gaugeFill.offsetWidth;
        
        // Trigger animation
        setTimeout(() => {
            gaugeFill.style.transition = 'transform 1s cubic-bezier(0.22, 1, 0.36, 1)';
            const finalScore = (victim.score * 10).toFixed(1);
            const rotation = -225 + (victim.score * 180);
            gaugeFill.style.transform = `rotate(${rotation}deg)`;
            
            // Simple generic counter animation for text
            let current = 0.0;
            let target = parseFloat(finalScore);
            let interval = setInterval(() => {
                current += 0.5;
                if(current >= target) {
                    gaugeValue.innerText = finalScore;
                    clearInterval(interval);
                } else {
                    gaugeValue.innerText = current.toFixed(1);
                }
            }, 30);
        }, 50);
    }
    
    function closeModal() {
        document.getElementById('victimModal').classList.remove('active');
    }

    // Close modal on click outside
    document.getElementById('victimModal').addEventListener('click', (e) => {
        if(e.target.id === 'victimModal') closeModal();
    });

    function updateSummary(summary) {
        if(!summary) return;
        document.getElementById('summaryText').innerHTML = 
            `Last Scanned: <b>${new Date(reportData.timestamp).toLocaleString()}</b> &nbsp;&bull;&nbsp; 
             Total Issues: <b>${summary.total_incidents}</b> &nbsp;&bull;&nbsp; 
             Critical/High Threats: <b style="color:var(--critical)">${summary.critical_risk_count + summary.high_risk_count}</b>`;
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
        if(cachedVictims.length > 0) renderList(cachedVictims, e.target.value);
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        if(!reportData) return;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reportData, null, 2));
        const anchor = document.createElement('a');
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", "strider_scan_report.json");
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
    });

    document.getElementById('targetScanBtn').addEventListener('click', async () => {
        const target = document.getElementById('targetScanInput').value.trim();
        const btn = document.getElementById('targetScanBtn');
        const summary = document.getElementById('summaryText');
        
        btn.disabled = true;
        btn.innerText = 'Scanning...';
        summary.innerHTML = `Running Live Web Scrapers for <b>${target || 'ALL TARGETS'}</b>... This may take up to 20 seconds.`;
        document.getElementById('victimList').innerHTML = '';
        document.getElementById('heatmapContainer').style.display = 'none';

        try {
            const resp = await fetch('/api/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target: target })
            });
            if (!resp.ok) throw new Error("Backend scan failed");
            await loadData(); // Reloads the newly saved scan_report.json
        } catch (e) {
            summary.innerText = "Error running scan: " + e.message;
        } finally {
            btn.disabled = false;
            btn.innerText = 'Live Scan';
        }
    });

    // Boot
    loadData();

</script>
</body>
</html>
